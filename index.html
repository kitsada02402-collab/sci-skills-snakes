<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันไดงูทักษะวิทยาศาสตร์ 14 ทักษะ — ห้องเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12263a;--muted:#5b7186;--card:#fff;--line:#dbe6ef;--bg1:#0b2236;--bg2:#14405c;--accent:#ff8a1f;--teal:#14a59a;--good:#1f9d55;--bad:#e04258;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Sarabun',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
.kanit,h1,h2,h3,h4,.btn{font-family:'Kanit','Sarabun',sans-serif}
h2{font-size:26px;margin:0 0 10px;font-weight:700}h3{font-size:19px;margin:0 0 8px;font-weight:600}h4{margin:0;font-size:17px;font-weight:600}
.hidden{display:none!important}.center{text-align:center}.muted{color:var(--muted)}.grow{flex:1}
.note{color:var(--muted);font-size:14.5px;margin:6px 0 0}
a{color:var(--teal)}
#app{max-width:1180px;margin:0 auto;padding:10px 12px 60px}
.top{display:flex;align-items:center;gap:10px;color:#fff;padding:6px 4px 12px}
.top .logo{font-family:'Kanit';font-weight:700;font-size:22px}.top .logo small{display:block;font-size:13px;font-weight:500;color:#9fc7e0}
.top .demo{margin-left:auto;background:#ffcf5c;color:#5a3d00;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.panel{padding:18px}
.card.warn,.warn{background:#fff3cd;color:#6b4e00;border-radius:12px;padding:10px 14px}
.card.warn{box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.l{display:block;font-weight:600;margin:12px 0 4px;font-size:15.5px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{resize:vertical}
.err{background:#ffe3e7;color:#a3122d;border-radius:10px;padding:8px 12px;margin-top:10px;font-weight:600}
.btn{font-size:17px;font-weight:600;border:0;border-radius:14px;padding:10px 18px;cursor:pointer;background:var(--teal);color:#fff;transition:transform .08s,opacity .15s;display:inline-block}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent)}.btn.ghost{background:#e9f0f6;color:var(--ink)}
.btn.big{font-size:20px;padding:14px 24px}.btn.small{font-size:14.5px;padding:6px 12px;border-radius:10px}
.chip{display:inline-block;border-radius:999px;padding:2px 11px;font-size:13.5px;font-weight:600;background:#e9f0f6;color:var(--muted)}
.chip.t1{background:#d8f3e3;color:#16703c}.chip.t2{background:#dbe9ff;color:#1c4fb0}.chip.bonus{background:#fff0b8;color:#8a5a00}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px}
.okc{color:var(--good);font-weight:600}
/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:12px}
.rtile{position:relative;text-align:center;padding:8px 4px;border-radius:14px;background:#f3f8fc;border:2px solid transparent}
.rtile.me{border-color:var(--accent);background:#fff4e6}.rtile.dim{opacity:.5}
.rav{position:relative;display:inline-block}.rav .dot{position:absolute;right:0;bottom:2px;width:13px;height:13px;border-radius:50%;background:#b8c6d3;border:2px solid #fff}.rav .dot.on{background:#27c46b}
.rn{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc{font-size:12.5px;color:var(--muted)}
.kick{position:absolute;top:2px;right:2px;border:0;background:#ffe3e7;color:#a3122d;border-radius:50%;width:22px;height:22px;line-height:20px;font-size:15px;cursor:pointer;padding:0}
.bigav{margin:8px 0}.bigav.pop svg{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.avsvg{border-radius:50%;flex:none;display:block}.rav svg,.pchip svg{display:block}
/* lists */
.players{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:#f3f8fc}
.prow.cur{background:#fff1de;outline:2px solid var(--accent)}
.prow .nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}.prow .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.rk{min-width:32px;text-align:center;font-family:'Kanit';font-weight:700;font-size:18px}
.me-tag{background:var(--accent);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 8px;margin-left:6px;font-weight:600}
.sq{font-family:'Kanit';font-weight:700;font-size:22px;text-align:center;line-height:1}.sq small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.ok-dot{color:var(--good);font-weight:700;font-style:normal}
.dpair{display:inline-flex;align-items:center;gap:3px}.dsvg{display:block}
.pbar{height:8px;border-radius:99px;background:#dbe6ef;margin-top:5px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#7be0a3);border-radius:99px;transition:width .6s}
/* play (student) */
.play{display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px}
.phead .nm{flex:1;line-height:1.2}.phead .nm small{display:block;color:var(--muted);font-size:13px}
.rbadge{background:var(--bg2);color:#fff;border-radius:999px;padding:3px 12px;font-family:'Kanit';font-size:14.5px;font-weight:600}.rbadge.cap{background:#e9f0f6;color:var(--ink)}
.boardwrap{position:relative;background:#0a2236;border-radius:16px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.boardwrap svg,svg.mini,svg.fb{width:100%;height:auto;display:block}
.cellnum{font-family:'Kanit';font-weight:600;font-size:23px;fill:#15324b;stroke:#fff;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.tok{transition:transform .22s ease-out}.tok.slow{transition:transform .9s ease-in-out}
#banner{position:absolute;left:0;right:0;top:12px;display:flex;justify-content:center;pointer-events:none;z-index:2}
#banner div{font-family:'Kanit';font-weight:700;font-size:20px;color:#fff;border-radius:14px;padding:8px 18px;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:drop .35s ease-out;text-align:center}
#banner small{display:block;font-weight:500;font-size:13px;opacity:.95}
#banner .up{background:var(--good)}#banner .down{background:var(--bad)}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.qcard{padding:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dicechip{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.tbar{position:relative;height:22px;border-radius:99px;background:#e1ebf3;overflow:hidden;margin-bottom:10px}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#27c46b,#8be17d);border-radius:99px;transition:width .25s linear}
.tbar.low i{background:linear-gradient(90deg,#e04258,#ff8a1f)}
.tbar span{position:relative;display:block;text-align:center;font-weight:700;font-size:13.5px;line-height:22px;color:#12263a}
.q-text{font-size:19px;font-weight:600;line-height:1.5;margin:4px 0 10px}
.q-text sub,.opt sub{font-size:.72em}
.qfig{display:flex;justify-content:center;margin:2px 0 10px}.qfig svg{width:100%;height:auto;display:block}.bq .qfig svg{max-width:300px!important}
.q-opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;font-weight:600;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:54px;width:100%}
button.opt:active{transform:scale(.985)}
.opt .lt{flex:none;width:30px;height:30px;border-radius:50%;background:#e9f0f6;display:flex;align-items:center;justify-content:center;font-family:'Kanit';font-weight:700}
.opt.sel{border-color:var(--accent);background:#fff4e6}.opt.sel .lt{background:var(--accent);color:#fff}
.opt:disabled{cursor:default}
div.opt{cursor:default}
.opt.right{border-color:var(--good);background:#e3f6ea}.opt.right .lt{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#ffe9ec}.opt.wrong .lt{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.q-fb{border-radius:12px;padding:8px 12px;font-weight:600}.q-fb b{display:block;font-family:'Kanit';font-size:19px}
.q-fb.ok{background:#e3f6ea;color:#14663a}.q-fb.no{background:#ffe9ec;color:#9c1a30}
.exp{margin-top:10px;background:#eef6fb;border-radius:12px;padding:10px 12px;font-size:15.5px}
.mvlist{margin-top:10px;display:flex;flex-direction:column;gap:3px}
.mv{display:flex;align-items:center;gap:8px;font-size:14.5px;padding:3px 6px;border-radius:8px}.mv.me{background:#fff1de}
.mv .mn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mv .mt{font-weight:700}.mv .mt.ok{color:var(--good)}.mv .mt.no{color:var(--muted)}.mv .mp{min-width:28px;text-align:right;font-family:'Kanit';font-weight:600}
/* teacher */
.tnav,.tnav2{padding:8px 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tab{font-family:'Kanit';font-weight:600;font-size:16px;border:0;background:#e9f0f6;color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer}
.tab.on{background:var(--teal);color:#fff}.tab.ghost{background:transparent;color:var(--muted)}
.rhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigcode{font-family:'Kanit';font-weight:700;font-size:48px;letter-spacing:10px;color:var(--teal);line-height:1.05}
.linkrow{display:flex;gap:8px;margin-top:8px}.linkrow input{font-size:14px;padding:8px 10px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ggrid.big{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.gcard{margin:0}.gcard.click{cursor:pointer}.gcard.click:hover{outline:3px solid var(--teal)}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gfoot{margin-top:6px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:#f3f8fc;border-radius:999px;padding:3px 10px 3px 3px;font-size:14.5px;font-weight:600}
svg.mini{background:#0a2236;border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}.tbl th{text-align:left;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding:6px 8px}.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.focus{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:8px}
@media(max-width:820px){.focus{grid-template-columns:1fr}}
svg.fb{background:#0a2236;border-radius:12px}
.qmini{background:#f3f8fc;box-shadow:none;padding:10px 12px;margin:8px 0}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sbox{text-align:center;margin:0 0 12px}.sbox b{font-size:30px;display:block}
.hbar{display:grid;grid-template-columns:minmax(120px,240px) 1fr 52px;gap:10px;align-items:center;margin:6px 0}
.hl{font-weight:600;font-size:15px}.hl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.hb{height:16px;background:#e5edf4;border-radius:99px;overflow:hidden}.hb i{display:block;height:100%;border-radius:99px}
.hp{font-family:'Kanit';font-weight:700;text-align:right}
.bl{display:grid;gap:10px}.bq{border:2px solid var(--line);border-radius:14px;padding:10px 12px}.bq.off{opacity:.5}
.bqm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.bqa{font-size:15px;margin:4px 0 8px}
/* misc overlays */
#modal{position:fixed;inset:0;background:rgba(5,18,30,.62);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:18px 12px;overflow:auto}
#modal.hidden{display:none}
.mbox{width:100%;max-width:560px;margin:auto 0;box-shadow:0 20px 60px rgba(0,0,0,.5)}.mbox.wide{max-width:1020px}.mbox.small{max-width:420px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#12263a;color:#fff;padding:10px 20px;border-radius:999px;z-index:60;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#toast.hidden{display:none}
@media(max-width:560px){body{font-size:16px}.bigcode{font-size:40px}.q-text{font-size:17.5px}.stat3{gap:8px}.hbar{grid-template-columns:100px 1fr 44px}}


/* dice popup + turn UI */
.dpop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(10,25,40,.55);pointer-events:none}
.dpop.on{display:flex}
.dbox{background:#fff;border-radius:22px;padding:18px 26px 20px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.4);min-width:230px;max-width:92vw;animation:dpin .25s ease-out}
.dttl{font-family:'Kanit';font-weight:600;font-size:18px;color:#12263a;margin-bottom:10px}
.dice-row{display:flex;gap:16px;justify-content:center;min-height:100px}
.dc{width:96px;height:96px}.dc .dsvg{width:96px;height:96px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.dc.spin{animation:dshake .38s linear infinite}.dc.spin:nth-child(2){animation-delay:-.17s;animation-direction:reverse}
.dc.land{animation:dland .5s cubic-bezier(.3,1.6,.5,1)}
.dsum{font-family:'Kanit';font-size:28px;font-weight:700;color:#12263a;margin-top:12px}.dsum b{color:#e8590c}
@keyframes dshake{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(-24deg) translateY(-16px) scale(1.06)}50%{transform:rotate(18deg) translateY(0) scale(1)}75%{transform:rotate(-12deg) translateY(-10px) scale(1.04)}100%{transform:rotate(0) translateY(0) scale(1)}}
@keyframes dland{0%{transform:scale(.4) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
@keyframes dpin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.turn-dot{background:var(--accent);color:#fff;border-radius:999px;font-size:12px;padding:2px 9px;font-weight:600;white-space:nowrap}
.turnbox{display:flex;align-items:center;gap:10px;justify-content:center;margin:2px 0 8px;font-weight:600}
.hint{font-size:14px;margin:8px 0 0;padding:6px 10px;border-radius:10px;background:#fff6e0;color:#7a4a00;font-weight:600}
.tpop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,25,40,.62);padding:10px}
.tpop.on{display:flex}
.tbox{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:94vh;overflow:auto;padding:16px 16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:dpin .22s ease-out}
.tbox .tbar{margin-top:0}
.rbadge.turnme{background:var(--accent);color:#fff}.rbadge.turn{background:#e7f0f7;color:#12263a}
</style>
</head>

<script>
/* ============================================================
   ENGINE  (pure functions — no DOM, no database)
   ============================================================ */
/* ---- ภาพประกอบโจทย์ (SVG สร้างจากสตริง im) ---- */
/* ============================================================
   FIGURES  (ภาพประกอบคำถาม สร้างด้วย SVG ในหน้าเว็บเอง ไม่ต้องใช้ไฟล์ภาพ)
   ในธนาคารข้อสอบ ช่อง "ภาพ" ใส่ข้อความรูปแบบ  ชื่อภาพ|ค่า1|ค่า2|...
   ชื่อภาพที่ใช้ได้: ruler cyl cyl2 thermo scale stopw bar line table pie emo shapes
                    leaves pots dissolve candle ramp batt shadows trans map
                    watercyc lung flow drops
   ============================================================ */
const Fig=(()=>{
  const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const INK='#12263a',MUT='#5b7186';
  const num=(v,d)=>{v=parseFloat(v);return isFinite(v)?v:(d||0);};
  const r1=v=>Math.round(v*10)/10;
  const T=(x,y,s,o)=>{o=o||{};return `<text x="${x}" y="${y}" font-family="Sarabun,Kanit,sans-serif" font-size="${o.s||15}" font-weight="${o.w||600}" fill="${o.c||INK}" text-anchor="${o.a||'middle'}">${E(s)}</text>`;};
  const EM=(x,y,s,size)=>`<text x="${x}" y="${y}" font-size="${size||44}" text-anchor="middle" font-family="'Noto Color Emoji','Segoe UI Emoji','Apple Color Emoji',sans-serif">${E(s)}</text>`;
  const L=(x1,y1,x2,y2,c,w,ex)=>`<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="${c||INK}" stroke-width="${w||1.5}"${ex||''}/>`;
  const R=(x,y,w,h,f,s,r,sw)=>`<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" rx="${r||0}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${sw||2}"`:''}/>`;
  const C=(x,y,r,f,s,sw)=>`<circle cx="${r1(x)}" cy="${r1(y)}" r="${r1(r)}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${sw||2}"`:''}/>`;
  const P=(pts,f,s,sw)=>`<polygon points="${pts}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${sw||2}" stroke-linejoin="round"`:''}/>`;
  const PAL=['#2f78f0','#ff8a1f','#2fb36b','#e04258','#7a5af8','#f0b400','#00a6c7','#8a8f98'];
  const nice=m=>{const t=m/5,st=[1,2,5,10,20,25,50,100,200,500,1000].find(s=>s>=t)||1000;return {st,max:Math.max(st,Math.ceil(m/st)*st)};};

               j:mv.jump?1:0,win:mv.to>=100?1:0,ms:a&&inp.t0!=null?Math.max(0,a.t-inp.t0):null,qk:key};
      const bq0=bank[qpub.id]||{};
      logs.push({u,n,q:qpub.id,tp:bq0.tp||qpub.tp||'',lv:bq0.t||qpub.t||0,k:a?a.k:-1,ci:ci==null?-1:ci,ok:ok?1:0,b:isBonus?1:0,ms:rows[u].ms});
    }
    // winner = first to reach 100 this round: fastest correct answer, ties by starting order
    let winner=null,best=Infinity;
    members.forEach((u,i)=>{
      if(rows[u].to>=100){const t=ans[u]?ans[u].t:Infinity;const score=t*100+i;if(score<best){best=score;winner=u;}}
    });
    return {rows,pos:newPos,logs,winner,anyJump};
  }

  // ranking of groups: reached 100 (fewer rounds, earlier) first, then by leader progress
  function rankGroups(ginfo){
    const list=Object.keys(ginfo).map(id=>Object.assign({id},ginfo[id]));
    const sc=g=>g.winner?[0,g.rounds||999,g.finishedAt||0]:[1,-(g.lead||0),-(g.avg||0)];
    return list.sort((a,b)=>{const x=sc(a),y=sc(b);for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]-y[i];}return 0;});
  }

  // text helper: "C_nH_{2n+2}" → safe HTML with subscripts, *bold*
  function fmt(s){
    const esc=String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    return esc.replace(/_\{([^}]+)\}|_([A-Za-z0-9])/g,(m,a,b)=>'<sub>'+(a||b)+'</sub>').replace(/\*([^*]+)\*/g,'<b>$1</b>');
  }
  return {LADDERS,SNAKES,JUMPS,SPECIAL,JUMP_LABEL,shuffle,arr,applyMove,applyBonus,groupSizes,makeGroups,makeGroupsN,dedupeAvatars,
          rollTwo,resolveOrder,levelFor,pickQuestion,presentQuestion,resolveRound,rankGroups,fmt};
})();

/* ============================================================
   BACKEND ADAPTER
   - Firebase Realtime Database (production)   : FIREBASE_CONFIG set
   - Local demo (BroadcastChannel between tabs): FIREBASE_CONFIG null
   Both expose the same tiny API so the game code never touches the SDK.
   ============================================================ */
const Backend=(()=>{
  const SDK_VER='10.14.1';
  const TS={'.sv':'timestamp'};
  const isTS=v=>v&&typeof v==='object'&&v['.sv']==='timestamp';
  function clean(v){
    if(v===undefined)return null;
    if(Array.isArray(v))return v.map(clean);
    if(v&&typeof v==='object'){
      if(isTS(v))return v;
      const o={};for(const k in v){if(v[k]!==undefined)o[k]=clean(v[k]);}return o;
    }
    if(typeof v==='number'&&!isFinite(v))return 0;
    return v;
  }
  function loadScript(src){
    return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('โหลดไม่สำเร็จ: '+src));document.head.appendChild(s);});
  }

  /* ---------------- Firebase ---------------- */
  async function createFirebase(cfg){
    const base='https://www.gstatic.com/firebasejs/'+SDK_VER+'/';
    await loadScript(base+'firebase-app-compat.js');
    await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-database-compat.js')]);
    firebase.initializeApp(cfg);
    const auth=firebase.auth();
    let user=auth.currentUser;
    if(!user){const r=await auth.signInAnonymously();user=r.user;}
    const db=firebase.database();
    let offset=0;
    db.ref('.info/serverTimeOffset').on('value',s=>{offset=s.val()||0;});
    const NS='sci14/',P=p=>(/^(admins\/|\.info\/)/.test(p)?p:NS+p);
    const ref=p=>db.ref(P(p));
    return {
      kind:'firebase',uid:user.uid,TS,
      now:()=>Date.now()+offset,
      on(path,cb,errcb){const r=ref(path);const h=r.on('value',s=>cb(s.val()),e=>{if(errcb)errcb(e);});return()=>r.off('value',h);},
      async get(path){const s=await ref(path).once('value');return s.val();},
      set(path,v){return ref(path).set(clean(v));},
      update(map){const m={};Object.keys(map).forEach(k=>{m[P(k)]=map[k];});return db.ref().update(clean(m));},
      remove(path){return ref(path).remove();},
      presence(path){
        const conn=db.ref('.info/connected');
        const h=conn.on('value',s=>{if(s.val()===true){const r=ref(path);r.onDisconnect().remove().then(()=>r.set(true)).catch(()=>{});}});
        return()=>{conn.off('value',h);ref(path).remove().catch(()=>{});};
      },
      async claimAdmin(pass){
        try{await ref('admins/'+user.uid).set(String(pass));return true;}catch(e){}
        if(/^\d+$/.test(String(pass))){try{await ref('admins/'+user.uid).set(Number(pass));return true;}catch(e){}}   // passcode typed as a number in the console
        return false;
      },
      async hasAdmin(){try{await ref('roomIndex').once('value');return true;}catch(e){return false;}},   // admin-only node: readable only if the passcode still matches
      async dropAdmin(){try{await ref('admins/'+user.uid).remove();}catch(e){}}
    };
  }

  /* ---------------- Local demo (same browser, many tabs) ---------------- */
  function createDemo(){
    const KEY='sci14_demo_uid';
    let uid=null;try{uid=sessionStorage.getItem(KEY);}catch(e){}
    if(!uid){uid='d'+Math.random().toString(36).slice(2,10);try{sessionStorage.setItem(KEY,uid);}catch(e){}}
    let data={};const L=new Set();
    const bc=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('sci14-snakes-demo-v1'):null;
    const parts=p=>String(p).split('/').filter(Boolean);
    const getAt=path=>{let c=data;for(const k of parts(path)){if(c==null||typeof c!=='object')return null;c=c[k];}return c===undefined?null:c;};
    function putAt(path,val){
      const ks=parts(path);
      if(!ks.length){data=val&&typeof val==='object'?val:{};return;}
      let c=data;const chain=[];
      for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null||typeof c[ks[i]]!=='object')c[ks[i]]={};chain.push([c,ks[i]]);c=c[ks[i]];}
      const last=ks[ks.length-1];
      if(val===null||val===undefined)delete c[last];else c[last]=JSON.parse(JSON.stringify(val));
      for(let i=chain.length-1;i>=0;i--){const [o,k]=chain[i];if(o[k]&&typeof o[k]==='object'&&!Object.keys(o[k]).length)delete o[k];else break;}
    }
    const stamp=v=>{
      if(isTS(v))return Date.now();
      if(Array.isArray(v))return v.map(stamp);
      if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=stamp(v[k]);return o;}
      return v;
    };
    function notify(){
      for(const l of [...L]){
        const cur=getAt(l.path),js=JSON.stringify(cur);
        if(js!==l.last){l.last=js;try{l.cb(cur===null?null:JSON.parse(js));}catch(e){console.error(e);}}
      }
    }
    function applyOps(ops){for(const o of ops)putAt(o.path,o.val);notify();}
    function write(ops,remote){
      ops=ops.map(o=>({path:o.path,val:o.val===undefined?null:stamp(o.val)}));
      applyOps(ops);
      if(!remote&&bc)bc.postMessage({t:'ops',ops});
    }
    let readyRes;const ready=new Promise(r=>{readyRes=r;});
    if(bc){
      bc.onmessage=e=>{
        const m=e.data;
        if(m.t==='ops')applyOps(m.ops);
        else if(m.t==='req')bc.postMessage({t:'snap',data});
        else if(m.t==='snap'){if(!Object.keys(data).length){data=m.data||{};notify();}readyRes();}
      };
      bc.postMessage({t:'req'});
      setTimeout(readyRes,500);          // nobody else open: start empty
    }else readyRes();
    const cleanups=[];
    window.addEventListener('pagehide',()=>cleanups.forEach(f=>{try{f();}catch(e){}}));
    return {
      kind:'demo',uid,TS,now:()=>Date.now(),
      on(path,cb){const l={path,cb,last:undefined};L.add(l);setTimeout(()=>{if(L.has(l)){const cur=getAt(path);l.last=JSON.stringify(cur);cb(cur===null?null:JSON.parse(l.last));}},0);return()=>L.delete(l);},
      async get(path){await ready;const v=getAt(path);return v===null?null:JSON.parse(JSON.stringify(v));},
      set(path,v){write([{path,val:clean(v)}]);return Promise.resolve();},
      update(map){write(Object.keys(map).map(p=>({path:p,val:clean(map[p])})));return Promise.resolve();},
      remove(path){write([{path,val:null}]);return Promise.resolve();},
      presence(path){write([{path,val:true}]);const off=()=>write([{path,val:null}]);cleanups.push(off);return off;},
      async claimAdmin(pass){if(String(pass)!=='1234')return false;write([{path:'admins/'+uid,val:'1234'}]);return true;},
      async hasAdmin(){await ready;return getAt('admins/'+uid)!==null;},
      async dropAdmin(){write([{path:'admins/'+uid,val:null}]);}
    };
  }

  async function create(cfg){
    if(cfg&&cfg.apiKey&&cfg.databaseURL)return createFirebase(cfg);
    return createDemo();
  }
  return {create,TS};
})();

const Board=(()=>{
  const {LADDERS,SNAKES,SPECIAL}=Engine;
  const ZONE=['#d9f5e6','#c6eddb','#dbeeff','#c5e0fc'];           // alternating tints, two zones
  const SNAKE_COL=[['#2fb36b','#17703f'],['#e0457b','#8f1f48'],['#f0a800','#9a6a00'],['#7a5af8','#4529b5'],['#00a6c7','#006a82'],['#ff7a1a','#a84a00'],['#5cc24a','#2f7a22'],['#d9453d','#8a1f1a']];
  function cc(n){const i=n-1,r=Math.floor(i/10);let c=i%10;if(r%2===1)c=9-c;return [c*100+50,(9-r)*100+50];}
  const hex=(cx,cy,r)=>[0,1,2,3,4,5].map(k=>{const a=Math.PI/3*k+Math.PI/6;return (cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1);}).join(' ');
  function star(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
  function ladder(a,b){
    const [x0,y0]=cc(a),[x1,y1]=cc(b),dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux,w=15;
    const sx=x0+ux*16,sy=y0+uy*16,ex=x1-ux*16,ey=y1-uy*16,len=L-32;let s='';
    const rail=(sg,col,wd)=>`<line x1="${(sx+nx*w*sg).toFixed(1)}" y1="${(sy+ny*w*sg).toFixed(1)}" x2="${(ex+nx*w*sg).toFixed(1)}" y2="${(ey+ny*w*sg).toFixed(1)}" stroke="${col}" stroke-width="${wd}" stroke-linecap="round"/>`;
    s+=rail(-1,'#6b3f12',12)+rail(1,'#6b3f12',12);
    const cnt=Math.max(2,Math.floor(len/38));
    for(let i=1;i<=cnt;i++){const t=i/(cnt+1),px=sx+(ex-sx)*t,py=sy+(ey-sy)*t,
      l=`x1="${(px-nx*w).toFixed(1)}" y1="${(py-ny*w).toFixed(1)}" x2="${(px+nx*w).toFixed(1)}" y2="${(py+ny*w).toFixed(1)}"`;
      s+=`<line ${l} stroke="#6b3f12" stroke-width="10" stroke-linecap="round"/><line ${l} stroke="#e3b061" stroke-width="5.5" stroke-linecap="round"/>`;}
    return s+rail(-1,'#e3a04d',7)+rail(1,'#e3a04d',7);
  }
  function snake(a,b,idx){
    const [x0,y0]=cc(a),[x1,y1]=cc(b),dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
    const N=Math.max(3,Math.round(L/115)),amp=36*(idx%2?1:-1),pts=[];
    for(let i=0;i<=N;i++)pts.push([x0+dx*i/N,y0+dy*i/N]);
    const c1=[(pts[0][0]+pts[1][0])/2+nx*amp,(pts[0][1]+pts[1][1])/2+ny*amp];
    let d=`M${pts[0][0]} ${pts[0][1]} Q${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${pts[1][0].toFixed(1)} ${pts[1][1].toFixed(1)}`;
    for(let i=2;i<=N;i++)d+=` T${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
    const [col,dark]=SNAKE_COL[idx%SNAKE_COL.length],ang=Math.atan2(y0-c1[1],x0-c1[0])*180/Math.PI;
    return `<path d="${d}" fill="none" stroke="${dark}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/><path d="${d}" fill="none" stroke="${col}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 20"/><g transform="translate(${x0} ${y0}) rotate(${ang.toFixed(1)})"><path d="M26 0L44 0M40 0L47 -6M40 0L47 6" stroke="#e8223d" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="6" cy="0" rx="26" ry="19" fill="${dark}"/><ellipse cx="6" cy="0" rx="23" ry="16" fill="${col}"/><circle cx="12" cy="-9" r="6" fill="#fff"/><circle cx="12" cy="9" r="6" fill="#fff"/><circle cx="14" cy="-9" r="3" fill="#12263a"/><circle cx="14" cy="9" r="3" fill="#12263a"/></g>`;
  }
  function artInner(){
    let h='',nums='';
    h+='<rect x="-10" y="-10" width="1020" height="1020" rx="26" fill="#0a2236"/>';
    for(let n=1;n<=100;n++){
      const [cx,cy]=cc(n),x=cx-50,y=cy-50,i=n-1,r=Math.floor(i/10),c=i%10,sp=SPECIAL.includes(n);
      const zone=n<=50?0:2;
      const fill=n===100?'#ffd75e':sp?'#fff0b8':ZONE[zone+((r+c)%2)];
      h+=`<rect x="${x+2}" y="${y+2}" width="96" height="96" rx="10" fill="${fill}"${sp?' stroke="#f0b400" stroke-width="4"':''}/>`;
      if(sp)h+=`<polygon points="${star(x+72,y+70,22,10)}" fill="#ffb400" stroke="#c98200" stroke-width="2.5" stroke-linejoin="round"/><text x="${x+72}" y="${y+76}" text-anchor="middle" font-family="Kanit,sans-serif" font-weight="700" font-size="18" fill="#fff">?</text>`;
      else h+=`<polygon points="${hex(x+74,y+72,17)}" fill="none" stroke="rgba(18,38,58,.13)" stroke-width="3"/><circle cx="${x+74}" cy="${y+72}" r="8.5" fill="none" stroke="rgba(18,38,58,.13)" stroke-width="2.5"/>`;
      nums+=`<text class="cellnum" x="${x+9}" y="${y+31}">${n}</text>`;
    }
    const [fx,fy]=cc(100);
    h+=`<text x="${fx+8}" y="${fy+22}" text-anchor="middle" font-family="Kanit,sans-serif" font-weight="700" font-size="26" fill="#9a6a00">เส้นชัย</text>`;
    h+='<rect x="0" y="1012" width="1000" height="80" rx="20" fill="#123a55"/>';
    h+='<text x="990" y="1062" text-anchor="end" font-family="Kanit,sans-serif" font-weight="600" font-size="26" fill="#8fc0dc">จุดเริ่มต้น  ▶  ช่อง 1</text>';
    Object.entries(LADDERS).forEach(([a,b])=>{h+=`<g>${ladder(+a,b)}</g>`;});
    Object.entries(SNAKES).forEach(([a,b],i)=>{h+=`<g>${snake(+a,b,i)}</g>`;});
    return h+nums;
  }
  function mount(){
    if($('#boardArt'))return;
    const d=document.createElement('div');d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
    d.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0"><symbol id="boardArt" viewBox="-12 -12 1024 1112">${artInner()}</symbol></svg>`;
    document.body.appendChild(d);
  }
  function offs(n,j){
    if(n===1)return [0,0,1];
    if(n===2)return [[-20,0],[20,0]][j].concat(.82);
    if(n===3)return [[-21,-14],[21,-14],[0,18]][j].concat(.72);
    const cols=3,c=j%cols,r=Math.floor(j/cols),rows=Math.ceil(n/cols);
    if(n<=6)return [(c-1)*29,(r-(rows-1)/2)*30,.6];
    return [(c-1)*26,(r-(rows-1)/2)*24,.5];
  }
  function slots(members,pos){
    const g={};members.forEach(u=>{const p=pos[u]|0;(g[p]=g[p]||[]).push(u);});
    const out={};
    Object.keys(g).forEach(k=>{const arr=g[k],p=+k;arr.forEach((u,j)=>{
      if(p===0){out[u]={x:70+members.indexOf(u)*92,y:1052,s:.95};}
      else{const [cx,cy]=cc(p),o=offs(arr.length,j);out[u]={x:cx+o[0],y:cy+o[1],s:o[2]};}
    });});
    return out;
  }
  function token(u,av,isMe,r){
    return `<g class="tok" data-u="${esc(u)}"><g class="pawn"><ellipse cx="0" cy="${(r*.92).toFixed(1)}" rx="${(r*.75).toFixed(1)}" ry="${(r*.24).toFixed(1)}" fill="rgba(0,0,0,.28)"/><svg x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" viewBox="0 0 100 100">${Avatars.inner(av.a,av.c)}</svg><circle r="${r}" fill="none" stroke="${isMe?'#ff8a1f':'#fff'}" stroke-width="${isMe?7:4.5}"/></g></g>`;
  }
  /* A live board bound to one <svg> element */
  class View{
    constructor(svg,opt){
      this.svg=svg;this.mini=!!(opt&&opt.mini);this.me=opt&&opt.me;this.shown={};this.members=[];this.profiles={};
      svg.setAttribute('viewBox','-12 -12 1024 1112');
      svg.innerHTML=`<use href="#boardArt" x="-12" y="-12" width="1024" height="1112"/><g class="toks"></g>`;
      this.layer=svg.querySelector('.toks');this.busy=0;
    }
    setMembers(members,profiles){
      const key=members.join(',')+'|'+members.map(u=>{const a=(profiles[u]||{}).av||{};return a.a+'.'+a.c;}).join(',');
      this.profiles=profiles;
      if(key===this.key)return;this.key=key;this.members=members.slice();
      const r=this.mini?36:28,list=members.slice().sort((a,b)=>(a===this.me)-(b===this.me));
      this.layer.innerHTML=list.map(u=>token(u,(profiles[u]||{}).av||{a:0,c:0},u===this.me,r)).join('');
      this.els={};$$('.tok',this.layer).forEach(g=>{this.els[g.dataset.u]=g;});
      this.render(false);
    }
    place(pos,slow){this.shown=Object.assign({},pos);this.render(slow);}
    render(slow){
      const sl=slots(this.members,this.shown);
      for(const u of this.members){const g=this.els&&this.els[u],s=sl[u];if(!g||!s)continue;
        g.classList.toggle('slow',!!slow);g.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.s})`;}
    }
    async animate(rows,finalPos){
      this.busy++;
      try{
        const jobs=[];
        for(const u of this.members){
          const r=rows[u];if(!r)continue;
          jobs.push((async()=>{
            const from=r.from|0,land=r.land|0,step=land>=from?1:-1;
            if(r.ok||r.b){
              let p=from;this.shown[u]=p;
              const maxSteps=14;let k=0;
              while(p!==land&&k++<maxSteps){p+=step;this.shown[u]=p;this.render(false);await sleep(210);}
              this.shown[u]=land;this.render(false);
            }
            if(r.j){await sleep(300);this.shown[u]=r.to;this.render(true);await sleep(1000);}
          })());
        }
        await Promise.all(jobs);
      }finally{
        if(finalPos)this.shown=Object.assign({},finalPos);
        this.render(false);this.busy--;
      }
    }

    async walk(u,from,to,ms){
      this.busy++;
      try{
        const step=to>=from?1:-1;let p=from,k=0;
        this.shown[u]=p;this.render(false);
        while(p!==to&&k++<110){p+=step;this.shown[u]=p;this.render(false);await sleep(ms||330);}
      }finally{this.busy--;}
    }
    /* turn-based driver: call on every state change; plays each turn's animation once */
    follow(rd,pos,h){
      h=h||{};
      if(this.busy)return;
      const n=rd&&(rd.n|0),u=rd&&rd.u,ph=rd&&rd.phase;
      if(!n||!u||!this.els||!this.els[u]||ph==='wait'||ph==='roll'){this.place(pos,false);if(this.els&&n)this.init=true;return;}
      const late=!this.init;this.init=true;
      const at=p=>Object.assign({},pos,{[u]:p});
      const done=()=>{if(h.after)h.after();};
      if(ph==='move'){
        if(this.mvN!==n){
          this.mvN=n;
          if(late){this.place(at(rd.land),false);return;}
          this.place(at(rd.from),false);
          this.busy++;
          (async()=>{try{
            if(h.onRoll)await h.onRoll(rd);else await sleep(1400);
            await this.walk(u,rd.from,rd.land,330);
          }catch(e){}finally{this.busy--;this.shown[u]=rd.land;this.render(false);done();}})();
          return;
        }
        this.place(at(rd.land),false);return;
      }
      if(ph==='answer'){this.mvN=n;this.place(at(rd.land),false);return;}
      if(ph==='result'){
        const res=rd.res;
        if(this.rsN!==n&&res){
          const had=this.mvN===n&&!late;
          this.rsN=n;this.mvN=n;
          if(!had){this.place(pos,false);return;}
          this.busy++;
          (async()=>{try{
            this.place(at(res.land),false);
            if(h.onResult)await h.onResult(rd);
            if(res.ok){
              if(res.b){await sleep(500);await this.walk(u,res.land,res.l2,330);}
              if(res.j){await sleep(300);this.shown[u]=res.to;this.render(true);if(h.onJump)h.onJump(rd);await sleep(1100);}
            }else{
              await sleep(400);
              await this.walk(u,res.land,res.from,Math.max(90,Math.min(220,Math.round(1800/Math.max(1,res.land-res.from)))));
            }
          }catch(e){}finally{this.busy--;this.place(pos,false);done();}})();
          return;
        }
        this.place(pos,false);return;
      }
      this.place(pos,false);
    }
  }
  return {cc,mount,View,slots};
})();

    if(!j.code||(urlCode&&urlCode!==j.code))return false;
    try{
      const [meta,mine]=await Promise.all([be.get('rooms/'+j.code+'/meta'),be.get('rooms/'+j.code+'/players/'+be.uid)]);
      if(meta&&mine){start(j.code);return true;}
    }catch(e){}
    return false;
  }

  /* ---------------- subscriptions ---------------- */
  function start(code){
    R=code;st={meta:null,players:{},pl:false,presence:{},assign:{},ginfo:{},rank:null,g:null,myAns:null};
    gid=null;lastResN=null;answeredLocal=null;rolledLocal=false;screen='';pb=null;
    const b='rooms/'+R+'/';
    const onErr=()=>{};
    un=[be.on(b+'meta',v=>{st.meta=v;sched();},onErr),
        be.on(b+'players',v=>{st.players=v||{};st.pl=true;sched();},onErr),
        be.on(b+'presence',v=>{st.presence=v||{};sched();},onErr),
        be.on(b+'assign',v=>{st.assign=v||{};sched();},onErr),
        be.on(b+'ginfo',v=>{st.ginfo=v||{};sched();},onErr),
        be.on(b+'rank',v=>{st.rank=v;sched();},onErr)];
    unPres=be.presence(b+'presence/'+be.uid);
    if(!timerH)timerH=setInterval(tickTimer,250);
    sched();
  }
  function watchGroup(){
    const g=st.assign[be.uid]||null;
    if(g===gid)return;
    gUn.forEach(f=>f());gUn=[];gid=g;st.g=null;st.myAns=null;lastResN=null;answeredLocal=null;rolledLocal=false;orderPop=false;rollN=0;DicePop.hide();screen='';pb=null;
    if(!gid)return;
    const b='rooms/'+R+'/';
    gUn=[be.on(b+'g/'+gid,v=>{st.g=v||{};sched();}),
         be.on(b+'ans/'+gid+'/'+be.uid,v=>{st.myAns=v;sched();})];
  }
  function stopAll(clearRoom){
    un.forEach(f=>f());un=[];gUn.forEach(f=>f());gUn=[];
    if(unPres){unPres();unPres=null;}
    if(timerH){clearInterval(timerH);timerH=null;}
    st=null;gid=null;pb=null;screen='';mHide();DicePop.hide();
    if(clearRoom)R=null;
  }
  function sched(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render();});}

  /* ---------------- helpers ---------------- */
  const me=()=>(st.players[be.uid]||null);
  const tile=(u,opt)=>{
    const p=st.players[u]||{name:'?',cls:'',av:{a:0,c:0}},on=!!st.presence[u];
    return `<div class="rtile${u===be.uid?' me':''}${opt&&opt.dim?' dim':''}"><div class="rav">${Avatars.svg(p.av.a,p.av.c,54)}<i class="dot ${on?'on':''}"></i></div><div class="rn">${esc(p.name)}</div><div class="rc">${esc(p.cls||'')}</div></div>`;
  };
  function members(){
    const info=(st.g&&st.g.info)||{};
    const ord=A_(info.order);
    if(ord.length)return ord;
    return Object.keys(st.assign).filter(u=>st.assign[u]===gid&&st.players[u]).sort((a,b)=>String(st.players[a].name).localeCompare(String(st.players[b].name),'th'));
  }
  const gName=()=>((st.ginfo[gid]||{}).name)||'กลุ่ม';

  /* ---------------- render router ---------------- */
  function render(){
    if(!st)return;
    watchGroup();
    const meta=st.meta;
    if(!meta){if(screen!=='gone'){screen='gone';$('#view').innerHTML=`<div class="card panel center"><h2>ห้องนี้ถูกปิดแล้ว</h2><p class="muted">ตรวจรหัสห้อง หรือรอครูเปิดห้องใหม่</p><button class="btn primary" id="btnBack">กลับหน้าเข้าเล่น</button></div>`;$('#btnBack').onclick=leave;}return;}
    if(!me()){ // profile removed (kicked) → back to form
      if(!st.pl)return;   // player list not loaded yet: do NOT treat as kicked (joinForm() would stop all listeners for good)
      if(screen!=='kicked'){screen='kicked';joinForm('คุณถูกนำออกจากห้อง หรือยังไม่ได้ลงทะเบียน');}return;}
    if((meta.v|0)!==VER){if(screen!=='ver'){screen='ver';mHide();$('#view').innerHTML=`<div class="card panel center"><h2>เวอร์ชันของเกมไม่ตรงกัน</h2><p class="muted">หน้าเว็บของครูหรือของคุณยังเป็นเวอร์ชันเก่า<br>ให้ <b>ครูและนักเรียนทุกคน</b> รีเฟรชหน้าแรง ๆ (Ctrl+Shift+R) แล้วครูเปิดห้องใหม่</p><button class="btn primary" id="btnReload">รีเฟรชหน้านี้</button></div>`;$('#btnReload').onclick=()=>location.reload();}return;}
    const status=meta.status;
    if(status==='lobby'||!gid){
      if(status!=='lobby'&&!gid){setScreen('wait',()=>`<div class="card panel center"><div class="bigav">${Avatars.svg(me().av.a,me().av.c,110)}</div><h2>รอครูจัดกลุ่ม</h2><p class="muted">เกมกำลังดำเนินอยู่ คุณยังไม่ได้อยู่ในกลุ่มใด</p></div>`);return;}
      return renderLobby();
    }
    if(status==='grouped')return renderGroup();
    if(status==='order')return renderOrder();
    return renderPlay();
  }
  function setScreen(name,fn){screen=name;$('#view').innerHTML=fn();}
  function leave(){
    const code=R;
    if(code)be.remove('rooms/'+code+'/players/'+be.uid).catch(()=>{});
    saveJoin(Object.assign(loadJoin(),{code:''}));
    stopAll(true);joinForm();
  }

  /* ---------------- lobby ---------------- */
  function renderLobby(){
    const m=me(),ids=Object.keys(st.players).sort((a,b)=>(st.players[a].ts||0)-(st.players[b].ts||0));
    const online=ids.filter(u=>st.presence[u]).length;
    const first=screen!=='lobby';screen='lobby';
    $('#view').innerHTML=`
      <div class="card panel center">
        <div class="muted">ห้องเกม <b class="kanit" style="font-size:22px;letter-spacing:4px">${esc(R)}</b></div>
        <div class="bigav ${first?'pop':''}">${Avatars.svg(m.av.a,m.av.c,130)}</div>
        <h2>${esc(m.name)} <span class="muted" style="font-size:16px">${esc(m.cls)}</span></h2>
        <div>ตัวการ์ตูนของคุณคือ <b>“น้อง${esc(Avatars.NAMES[m.av.a]||'')}”</b></div>
        <p class="muted" style="margin:10px 0 0">รอครูสุ่มกลุ่ม… ดูได้เลยว่าใครเข้ามาแล้วบ้าง</p>
      </div>
      <div class="card panel">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 class="kanit">เข้าห้องแล้ว ${ids.length} คน</h3><span class="muted">ออนไลน์ ${online}</span></div>
        <div class="roster">${ids.map(u=>tile(u)).join('')}</div>
        <div class="center" style="margin-top:12px"><button class="btn ghost" id="btnLeave" style="font-size:15px;padding:6px 14px">ออกจากห้อง</button></div>
      </div>`;
    $('#btnLeave').onclick=leave;
  }

  /* ---------------- group reveal ---------------- */
  function renderGroup(){
    const ids=members();screen='group';
    $('#view').innerHTML=`
      <div class="card panel center">
        <div class="muted">คุณอยู่ใน</div>
        <h2 style="font-size:36px;color:var(--teal)">${esc(gName())}</h2>
        <div class="roster" style="margin-top:12px">${ids.map(u=>tile(u)).join('')}</div>
        <p class="muted" style="margin-top:12px">รอครูให้สัญญาณทอยลูกเต๋าจัดลำดับการเล่น…</p>
      </div>`;
  }

  /* ---------------- order dice ---------------- */
  function renderOrder(){
    const g=st.g||{},info=g.info||{},ord=g.order||{},rolls=g.rolls||{},ids=members();
    const mine=ord[be.uid],done=!!info.orderDone;
    const sorted=done?A_(info.order):ids;
    if(screen!=='order'){
      screen='order';
      $('#view').innerHTML=`<div class="card panel"><h2>${esc(gName())} · ทอยลูกเต๋าจัดลำดับ</h2>
        <p class="muted" style="margin:0 0 10px">คะแนนรวมสูงสุดได้เล่นก่อน ถ้าเสมอจะทอยใหม่เฉพาะคนที่เสมอ</p>
        <div class="players" id="orderRows"></div><div style="margin-top:14px" id="orderAct"></div></div>`;
      dockKey='';
    }
    const rowsHTML=sorted.map((u,i)=>{
      const p=st.players[u]||{name:'?',av:{a:0,c:0}},o=ord[u];
      const dice=o?`<span class="dpair">${diceSVG(o.d1,32)}${diceSVG(o.d2,32)}<b class="kanit">= ${o.t}</b></span>`:(rolls[u]?'<span class="muted">กำลังทอย…</span>':'<span class="muted">ยังไม่ทอย</span>');
      const tbn=done&&info.tb&&info.tb[u]?'<small class="muted"> (เสมอ ทอยใหม่)</small>':'';
      return `<div class="prow${u===be.uid?' cur':''}">${done?`<span class="rk">${medal(i)}</span>`:''}${Avatars.svg(p.av.a,p.av.c,40)}<div class="nm">${esc(p.name)}${u===be.uid?'<span class="me-tag">คุณ</span>':''}${tbn}</div>${dice}</div>`;
    }).join('');
    if(dockKey!==rowsHTML){dockKey=rowsHTML;$('#orderRows').innerHTML=rowsHTML;}
    // the action area is rebuilt only when MY state changes, so the button is never swapped under a finger
    if(orderPop&&mine){orderPop=false;DicePop.reveal([mine.d1,mine.d2],1500);}
    const mode=done?'done':(!mine&&!rolls[be.uid]&&!rolledLocal)?'btn':'wait';
    const act=$('#orderAct');
    if(act.dataset.mode!==mode){
      act.dataset.mode=mode;
      if(mode==='done')act.innerHTML='<p class="center" style="font-weight:700;color:var(--good)">ลำดับการเล่นพร้อมแล้ว รอครูกดเริ่มเกม</p>';
      else if(mode==='btn'){
        act.innerHTML='<button class="btn primary big" id="btnRoll2" style="width:100%">ทอยลูกเต๋า 2 ลูก</button>';
        const btn=$('#btnRoll2');
        btn.onclick=()=>{rolledLocal=true;orderPop=true;btn.disabled=true;DicePop.show('ทอยลูกเต๋า 2 ลูก จัดลำดับการเล่น',2);be.set('rooms/'+R+'/g/'+gid+'/rolls/'+be.uid,true).catch(()=>{toast('ส่งไม่สำเร็จ ลองใหม่');rolledLocal=false;orderPop=false;DicePop.hide();act.dataset.mode='';sched();});};
      }else act.innerHTML='<p class="center muted">ทอยแล้ว รอเพื่อนในกลุ่ม…</p>';
    }
  }

  /* ---------------- play (one player at a time) ---------------- */
  const nDice=()=>((st.meta&&st.meta.dn)===1?1:2);
  const pn=u=>((st.players[u]||{}).name)||'?';
  const who=u=>u===be.uid?'คุณ':pn(u);
  /* ---- pop-up window for my roll / my question / my result ---- */
  let mKind='',mKey='',mEl=null;
  function mShow(kind,key,html,bind){
    if(!mEl||!document.body.contains(mEl)){mEl=document.createElement('div');mEl.className='tpop';mEl.innerHTML='<div class="tbox"></div>';document.body.appendChild(mEl);}
    if(mKind===kind&&mKey===key&&mEl.classList.contains('on'))return;
    mKind=kind;mKey=key;const bx=mEl.querySelector('.tbox');bx.innerHTML=html;mEl.classList.add('on');bx.scrollTop=0;
    if(bind)bind(bx);
  }
  function mHide(){if(mEl)mEl.classList.remove('on');mKind='';mKey='';}
  const timerBar=()=>'<div class="tbar"><i id="mFill"></i><span id="mTxt"></span></div>';
  function rollModal(round){
    const nd=nDice(),m=me(),first=!(mKind==='roll'&&mKey===round.n);
    mShow('roll',round.n,`<div class="center">${timerBar()}<div style="display:flex;justify-content:center">${Avatars.svg(m.av.a,m.av.c,84)}</div><h2 class="kanit" style="margin:8px 0 4px">ถึงตาคุณแล้ว!</h2><p class="muted" style="margin:0 0 14px">กดทอยลูกเต๋า ${nd} ลูก ตัวละครจะเดินตามแต้ม แล้วตอบคำถาม<br>ตอบถูก = อยู่ช่องใหม่ · ตอบผิด = กลับช่องเดิม</p><button class="btn primary big" id="btnRoll" style="width:100%">🎲 ทอยลูกเต๋า ${nd} ลูก</button></div>`,bx=>{$('#btnRoll',bx).onclick=()=>doRoll(round);});
    if(first){try{navigator.vibrate&&navigator.vibrate(180);}catch(e){}}
    tickTimer();
  }
  function hintFor(sq){
    const jmp=Engine.JUMPS[sq],sp=Engine.SPECIAL.includes(sq)&&sq<100;
    return sp?'⭐ ช่องพิเศษ! ตอบถูกเดินหน้าเพิ่ม 2 ช่อง':(jmp?(jmp>sq?'🪜 ช่องนี้มีบันได ตอบถูกขึ้นไปช่อง '+jmp:'🐍 ช่องนี้มีงู ตอบถูกแล้วจะลื่นลงไปช่อง '+jmp):'');
  }
  function qModal(round){
    const q=round.q,sq=round.land,diceChips=A_(round.dice).map(v=>diceSVG(v,30)).join('');
    const ansK=st.myAns&&st.myAns.n===round.n?st.myAns.k:(answeredLocal&&answeredLocal.n===round.n?answeredLocal.k:null);
    const hint=hintFor(sq);
    mShow('q',round.n+'|'+ansK,`${timerBar()}
      <div class="qtop"><span class="dicechip"><span class="dpair">${diceChips}</span><span>อยู่ช่อง <b>${sq}</b></span></span><span class="chip t${q.t}">${TIER_TH[q.t]||''}</span></div>
      <div class="q-text">${Engine.fmt(q.q)}</div>${FIG(q.im)}
      <div class="q-opts">${A_(q.opts).map((o,k)=>`<button class="opt${ansK===k?' sel':''}" data-k="${k}" ${ansK!=null?'disabled':''}><span class="lt">${LET[k]}</span><span>${Engine.fmt(o)}</span></button>`).join('')}</div>
      ${hint?`<div class="hint">${hint}</div>`:''}
      <div class="center muted" style="margin-top:8px">${ansK!=null?'ส่งคำตอบแล้ว รอผล…':'ตอบถูกอยู่ช่อง '+sq+' · ตอบผิดกลับช่อง '+(round.from||'เริ่มต้น')}</div>`,
      bx=>{if(ansK==null)$$('.opt',bx).forEach(b=>{b.onclick=()=>submit(round,+b.dataset.k);});});
    tickTimer();
  }
  function syncModal(round,ids,fin){
    if(fin){mHide();return;}
    if(mKind==='res')return;                 // result pop-up is driven by the animation hook
    if(!round||!round.u){mHide();return;}
    const mine=round.u===be.uid&&ids.includes(be.uid);
    if(mine&&round.phase==='roll'&&rollN!==round.n){rollModal(round);return;}
    if(mine&&round.phase==='answer'){qModal(round);return;}
    mHide();
  }
  const hooks={
    after(){dockKey='';sched();},
    async onRoll(rd){
      const d=A_(rd.dice);
      if(!DicePop.active)DicePop.show(pn(rd.u)+' ทอยลูกเต๋า',d.length);
      await DicePop.reveal(d,1300);
    },
    onResult(rd){
      const r=rd.res,w=who(rd.u);
      const say=()=>{
        if(r.ok)banner(esc(w)+'ตอบถูก! '+(r.b?'⭐ ช่องพิเศษ +2 ช่อง':'อยู่ที่ช่อง '+r.land),'up');
        else banner(esc(w)+(r.k<0?'ไม่ทันเวลา':'ตอบไม่ถูก')+' กลับไปช่อง '+(r.from||'เริ่มต้น'),'down');
      };
      if(rd.u!==be.uid){say();return sleep(3600);}      // spectators: same pace as the player's result window
      return new Promise(res=>{
        let done=false,tm=0,iv=0,left=4;
        const fin=()=>{if(done)return;done=true;clearTimeout(tm);clearInterval(iv);mHide();res();};
        mShow('res',rd.n,resultModalHTML(rd),bx=>{$('#btnResClose',bx).onclick=fin;});
        iv=setInterval(()=>{left--;const e=$('#resLeft');if(e)e.textContent=left>0?'('+left+')':'';},1000);
        tm=setTimeout(fin,4200);
      }).then(()=>{say();return sleep(800);});
    },
    onJump(rd){const r=rd.res,up=r.to>r.l2;banner(`${up?'ขึ้นบันได!':'งูกัด!'} ช่อง ${r.l2} → ${r.to}<small>${esc(Engine.JUMP_LABEL[r.l2]||'')}</small>`,up?'up':'down');}
  };
  function mountPlay(){
    screen='play';dockKey='';
    $('#view').innerHTML=`<div class="play"><div class="phead" id="phead"></div><div class="boardwrap"><svg id="pbd" role="img" aria-label="กระดานเกม"></svg><div id="banner"></div></div><div id="dock"></div><div class="card" id="lead"></div></div>`;
    pb=new Board.View($('#pbd'),{me:be.uid});
  }
  function renderPlay(){
    if(screen!=='play'||!pb)mountPlay();
    const g=st.g||{},info=g.info||{},pos=g.pos||{},round=g.round||null;
    const ids=members();
    if(!info.order){$('#dock').innerHTML='<div class="card center muted">กำลังเตรียมเกม…</div>';return;}
    pb.setMembers(ids,st.players);
    const ginfo=st.ginfo[gid]||{},fin=ginfo.status==='finished'||st.meta.status==='done';
    if(fin){if(!pb.busy)pb.place(pos,false);}else pb.follow(round,pos,hooks);
    const m=me();
    const cap=st.meta&&st.meta.startedAt?st.meta.startedAt+(st.meta.capMin||30)*60000:0;
    const rn=round&&round.n?Math.ceil(round.n/Math.max(1,ids.length)):0;
    $('#phead').innerHTML=`${Avatars.svg(m.av.a,m.av.c,42)}<div class="nm"><b>${esc(m.name)}</b><small>${esc(gName())}</small></div>${round&&round.u&&!fin?(round.u===be.uid?'<div class="rbadge turnme">ตาคุณ!</div>':'<div class="rbadge turn">ตา '+esc(pn(round.u))+'</div>'):''}<div class="rbadge">รอบ ${rn}</div>${cap?`<div class="rbadge cap" id="capLeft">เหลือ ${fmtTime(cap-be.now())}</div>`:''}`;
    renderDock(round,pos,ids,ginfo,fin);
    renderLead(pos,ids,round);
    syncModal(round,ids,fin);
  }
  function banner(html,kind){const b=$('#banner');if(!b)return;b.innerHTML=`<div class="${kind}">${html}</div>`;clearTimeout(banner.h);banner.h=setTimeout(()=>{if(b)b.innerHTML='';},3200);}

  function doRoll(round){
    if(rollN===round.n)return;
    rollN=round.n;mHide();
    DicePop.show('ถึงตาคุณ! กำลังทอย…',nDice());
    be.set('rooms/'+R+'/g/'+gid+'/rq/'+be.uid,round.n).catch(()=>{rollN=0;DicePop.hide();toast('ส่งไม่สำเร็จ ลองใหม่');dockKey='';sched();});
    dockKey='';sched();
  }
  function renderDock(round,pos,ids,ginfo,fin){
    const dock=$('#dock');if(!dock)return;
    const uidIn=ids.includes(be.uid);
    const ansK=st.myAns&&round&&st.myAns.n===round.n?st.myAns.k:(answeredLocal&&round&&answeredLocal.n===round.n?answeredLocal.k:null);
    let key;
    if(fin)key='fin|'+(st.rank?1:0)+'|'+Object.values(st.ginfo).map(x=>x.status).join('');
    else key=(round?round.n+'|'+round.phase+'|'+round.u:'x')+'|'+ansK+'|'+(rollN===(round&&round.n)?1:0)+'|'+(pb&&pb.busy?1:0);
    if(key===dockKey)return;dockKey=key;
    if(fin){dock.innerHTML=finishHTML(ginfo);return;}
    if(!round||!round.n||!round.u){
      dock.innerHTML=`<div class="card center"><h3 class="kanit">เตรียมตัว! เกมกำลังจะเริ่ม</h3><p class="muted" style="margin:6px 0 0">เล่นทีละคนตามลำดับ: ทอยลูกเต๋า → ตัวละครเดินตามแต้ม → ตอบคำถาม<br>ตอบถูกอยู่ช่องใหม่ · ตอบผิดกลับช่องเดิม · ใครถึงช่อง 100 ก่อนชนะ</p></div>`;return;
    }
    const mine=round.u===be.uid,pu=st.players[round.u]||{name:'?',av:{a:0,c:0}};
    const turnHead=`<div class="turnbox">${Avatars.svg(pu.av.a,pu.av.c,40)}<span>${mine?'ตาของคุณ':'ตาของ '+esc(pu.name)}</span></div>`;
    if(round.phase==='roll'){
      const nd=nDice();
      dock.innerHTML=mine&&uidIn?`<div class="card qcard center">${turnHead}<p class="muted" style="margin:0">${rollN===round.n?'กำลังทอย…':'กดปุ่มทอยลูกเต๋าในหน้าต่างที่เด้งขึ้น'}</p></div>`:`<div class="card qcard center"><div class="tbar"><i id="tbarFill"></i><span id="tbarTxt"></span></div>${turnHead}<p class="muted" style="margin:0">รอ ${esc(pu.name)} ทอยลูกเต๋า…</p></div>`;
      tickTimer();return;
    }
    const diceChips=A_(round.dice).map(v=>diceSVG(v,34)).join('');
    if(round.phase==='move'){
      dock.innerHTML=`<div class="card qcard center">${turnHead}<div class="dicechip" style="justify-content:center"><span class="dpair">${diceChips}</span><span>ทอยได้ <b>${round.tot}</b> เดินจากช่อง ${round.from||'เริ่มต้น'} ไปช่อง <b>${round.land}</b></span></div><p class="muted" style="margin:8px 0 0">เตรียมตอบคำถาม…</p></div>`;return;
    }
    if(round.phase==='answer'){
      const q=round.q,sq=round.land,jmp=Engine.JUMPS[sq],sp=Engine.SPECIAL.includes(sq)&&sq<100;
      const hint=sp?'⭐ ช่องพิเศษ! ตอบถูกเดินหน้าเพิ่ม 2 ช่อง':(jmp?(jmp>sq?'🪜 ช่องนี้มีบันได ตอบถูกขึ้นไปช่อง '+jmp:'🐍 ช่องนี้มีงู ตอบถูกแล้วจะลื่นลงไปช่อง '+jmp):'');
      if(mine&&uidIn){dock.innerHTML=`<div class="card qcard center">${turnHead}<p class="muted" style="margin:0">ตอบคำถามในหน้าต่างที่เด้งขึ้น</p></div>`;return;}
      const can=false;
      dock.innerHTML=`<div class="card qcard">${turnHead}
        <div class="qtop"><span class="dicechip"><span class="dpair">${diceChips}</span><span>อยู่ช่อง <b>${sq}</b></span></span><span class="chip t${q.t}">${TIER_TH[q.t]||''}</span></div>
        <div class="tbar"><i id="tbarFill"></i><span id="tbarTxt"></span></div>
        <div class="q-text">${Engine.fmt(q.q)}</div>${FIG(q.im)}
        <div class="q-opts">${A_(q.opts).map((o,k)=>`<button class="opt${ansK===k?' sel':''}" data-k="${k}" ${can?'':'disabled'}><span class="lt">${LET[k]}</span><span>${Engine.fmt(o)}</span></button>`).join('')}</div>
        ${hint?`<div class="hint">${hint}</div>`:''}
        <div class="center muted" style="margin-top:8px">${mine?(ansK!=null?'ส่งคำตอบแล้ว รอผล…':'ตอบถูกอยู่ช่อง '+sq+' · ตอบผิดกลับช่อง '+(round.from||'เริ่มต้น')):'รอ '+esc(pu.name)+' ตอบ (ช่วยกันคิดได้ แต่ให้เจ้าของตาเป็นคนกดตอบ)'}</div></div>`;
      if(can)$$('.opt',dock).forEach(b=>{b.onclick=()=>submit(round,+b.dataset.k);});
      tickTimer();return;
    }
    if(round.phase==='result'&&round.res){dock.innerHTML=resultHTML(round,pu);return;}
    dock.innerHTML=`<div class="card center muted">รอครูควบคุมเกม…</div>`;
  }
  async function submit(round,k){
    if(round.u!==be.uid||(answeredLocal&&answeredLocal.n===round.n))return;
    answeredLocal={n:round.n,k};dockKey='';sched();
    try{await be.set('rooms/'+R+'/ans/'+gid+'/'+be.uid,{n:round.n,k,t:be.TS});}
    catch(e){answeredLocal=null;dockKey='';sched();toast('ส่งไม่ทัน หมดเวลาแล้ว');}
  }
  function resultHTML(round,pu){
    const r=round.res,q=round.q,mine=round.u===be.uid,w=mine?'คุณ':pu.name;
    const top=`<div class="q-fb ${r.ok?'ok':'no'}"><b>${r.ok?esc(w)+'ตอบถูก!':(r.k<0?esc(w)+'ไม่ทันเวลา':esc(w)+'ตอบยังไม่ถูก')}</b>${r.ok?(r.b?'ช่องพิเศษ เดินหน้าเพิ่ม 2 ช่อง':'อยู่ที่ช่อง '+r.land)+(r.j?(r.to>r.l2?' แล้วขึ้นบันไดไปช่อง '+r.to:' แล้วถูกงูกัดลงไปช่อง '+r.to):''):'กลับไปช่อง '+(r.from||'เริ่มต้น')}</div>`;
    const opts=A_(q.opts).map((o,k)=>{
      let c='opt';if(k===r.qk)c+=' right';else if(k===r.k)c+=' wrong';else c+=' dim';
      return `<div class="${c}"><span class="lt">${LET[k]}</span><span>${Engine.fmt(o)}</span></div>`;}).join('');
    return `<div class="card qcard">${top}<div class="q-text" style="margin-top:10px">${Engine.fmt(q.q)}</div>${FIG(q.im)}<div class="q-opts">${opts}</div>${r.ex?`<div class="exp">${Engine.fmt(r.ex)}</div>`:''}</div>`;
  }
  function resultModalHTML(rd){
    const pu=st.players[rd.u]||{name:'?',av:{a:0,c:0}};
    return resultHTML(rd,pu).replace(/^<div class="card qcard">/,'<div>').replace(/<\/div>$/,'')+`<button class="btn primary big" id="btnResClose" style="width:100%;margin-top:12px">ต่อไป <span id="resLeft">(4)</span></button></div>`;
  }
  function finishHTML(ginfo){
    const wName=ginfo.winnerName,w=ginfo.winner&&st.players[ginfo.winner];
    const list=Engine.rankGroups(st.ginfo);
    const rk=list.map((g,i)=>`<div class="prow${g.id===gid?' cur':''}"><span class="rk">${medal(i)}</span><div class="nm">${esc(g.name||g.id)}${g.id===gid?'<span class="me-tag">กลุ่มคุณ</span>':''}<small>${g.winner?`ผู้ชนะ ${esc(g.winnerName||'')} · ${g.rounds} รอบ`:(g.status==='finished'?'หมดเวลา · ไปถึงช่อง '+(g.lead||0):'กำลังเล่น · นำที่ช่อง '+(g.lead||0))}</small></div></div>`).join('');
    const all=Object.values(st.ginfo).every(x=>x.status==='finished');
    return `<div class="card center">
      ${ginfo.status==='finished'?`<div class="kanit" style="font-size:26px;font-weight:700;color:var(--good)">กลุ่มของคุณจบเกมแล้ว!</div>${w?`<div style="margin:8px 0;display:flex;justify-content:center">${Avatars.svg(w.av.a,w.av.c,80)}</div><div>ผู้ชนะคือ <b>${esc(wName||w.name)}</b></div>`:'<div class="muted">หมดเวลา จัดอันดับตามตำแหน่ง</div>'}`:'<div class="kanit" style="font-size:22px;font-weight:700">เกมจบแล้ว</div>'}
      <h3 class="kanit" style="margin-top:14px">${all?'อันดับกลุ่มทั้งห้อง':'อันดับกลุ่มตอนนี้ (รอกลุ่มอื่น)'}</h3><div class="players" style="text-align:left">${rk}</div></div>`;
  }
  function renderLead(pos,ids,round){
    const sorted=ids.map((u,i)=>({u,i,p:(pb&&pb.shown[u]!=null)?pb.shown[u]:(pos[u]|0)})).sort((a,b)=>b.p-a.p||a.i-b.i);
    $('#lead').innerHTML=`<h3 class="kanit" style="margin:0 0 8px">อันดับในกลุ่ม</h3><div class="players">${sorted.map((x,r)=>{
      const p=st.players[x.u]||{name:'?',av:{a:0,c:0}};
      const tn=round&&round.u===x.u&&round.phase!=='result'?'<span class="turn-dot">ตาเล่น</span>':'';
      return `<div class="prow${x.u===be.uid?' cur':''}"><span class="rk">${r===0&&x.p>0?'👑':r+1}</span>${Avatars.svg(p.av.a,p.av.c,36)}<div class="nm">${esc(p.name)}${x.u===be.uid?'<span class="me-tag">คุณ</span>':''}<small>ลำดับเล่นที่ ${x.i+1}</small></div>${tn}<div class="sq">${x.p||'เริ่ม'}<small>ช่อง</small></div></div>`;}).join('')}</div>`;
  }
  function tickTimer(){
    if(!st||!st.g)return;
    if(DicePop.spinning&&DicePop.age()>14000)DicePop.hide();
    const round=st.g.round;
    if(round&&(round.phase==='answer'||round.phase==='roll')){
      const total=Math.max(1,round.deadline-round.t0),left=round.deadline-be.now();
      [['#tbarFill','#tbarTxt'],['#mFill','#mTxt']].forEach(([fa,ta])=>{const fill=$(fa);if(!fill)return;
        fill.style.width=Math.max(0,Math.min(100,left/total*100))+'%';
        fill.parentNode.classList.toggle('low',left<6000);
        const tx=$(ta);if(tx)tx.textContent=left>0?Math.ceil(left/1000)+' วินาที':(round.phase==='roll'?'ระบบทอยให้':'หมดเวลา');});
    }
    const cl=$('#capLeft');
    if(cl&&st.meta&&st.meta.startedAt)cl.textContent='เหลือ '+fmtTime(st.meta.startedAt+(st.meta.capMin||30)*60000-be.now());
  }

  return {
    async enter(backend){
      be=backend;
      if(await tryRejoin())return;
      joinForm();
    },
    leaveView(){stopAll(true);}
  };
})();

/* ============================================================
   TEACHER SIDE  (also the game engine: this browser tab drives every group)
   ============================================================ */
const Teacher=(()=>{
  let be=null,R=null,S=null,un=[],tickH=null,clockH=null,raf=0,bankUn=null,idxUn=null;
  const tabId=Math.random().toString(36).slice(2,8);
  let top='room',sub='ctl',B={},bankReady=false,idx={},cfg={secs:20,capMin:30,ng:5,dn:2};
  const sigs={};let views={},boardsKey='',focusG=null,focusView=null,pending=false;
  let statsCode=null,logRows=null,logAt=0,logBusy=false,bankF={tp:'',t:'',q:'',lim:80},lastBankWarn=0,verWarn=0;
  const LSR='sci14_teacher_room_v1';
  const SPEED=(typeof window!=='undefined'&&+window.__SPEED)||1;   // test knob only: shortens pauses between rounds
  const b=()=>'rooms/'+R+'/';
  const now=()=>be.now();
  const gids=()=>Object.keys(S.ginfo||{}).sort((x,y)=>((S.ginfo[x].no|0)-(S.ginfo[y].no|0)));
  const pname=u=>(S.players[u]&&S.players[u].name)||'?';
  const groupMem=gid=>Object.keys(S.assign).filter(u=>S.assign[u]===gid&&S.players[u]);
  const members=gid=>{const o=A_(S.g[gid]&&S.g[gid].info&&S.g[gid].info.order);return o.length?o:groupMem(gid).sort((x,y)=>pname(x).localeCompare(pname(y),'th'));};
  const sched=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render();});};
  const saveRoom=c=>{try{c?localStorage.setItem(LSR,c):localStorage.removeItem(LSR);}catch(e){}};
  const savedRoom=()=>{try{return localStorage.getItem(LSR)||'';}catch(e){return '';}};
  const joinLink=()=>location.origin+location.pathname+'?r='+R;
  const statusTH={lobby:'รอนักเรียนเข้าห้อง',grouped:'จัดกลุ่มแล้ว',order:'ทอยเต๋าจัดลำดับ',play:'กำลังเล่น',done:'จบเกมแล้ว'};

  /* ---------- parts that rebuild only when their signature changes ---------- */
  function setPart(id,sig,html,bind){
    const el=$('#'+id);if(!el)return false;
    if(sigs[id]===sig)return false;
    const a=document.activeElement;
    if(a&&el.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){pending=true;return false;}
    sigs[id]=sig;el.innerHTML=html();if(bind)bind(el);return true;
  }
  document.addEventListener('focusout',()=>{if(pending){pending=false;setTimeout(sched,60);}});

  /* ============================================================
     LOGIN
     ============================================================ */
  function loginForm(msg){
    $('#view').innerHTML=`<div class="card panel" style="max-width:420px;margin:30px auto">
      <h2>เข้าสู่โหมดครู</h2>
      <label class="l">รหัสผ่านครู</label><input type="password" id="tPass" autocomplete="current-password">
      <div class="err ${msg?'':'hidden'}" id="tErr">${esc(msg||'')}</div>
      <button class="btn primary big" id="tGo" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button>
      <div class="note center" style="margin-top:12px"><a href="#" id="tBack" style="color:var(--muted)">กลับหน้านักเรียน</a></div>
      ${be.kind==='demo'?'<div class="note center" style="margin-top:8px">โหมดทดลอง (ยังไม่ได้ต่อฐานข้อมูล): รหัสคือ 1234</div>':''}</div>`;
    const go=async()=>{
      const pw=$('#tPass').value;if(!pw)return;
      $('#tGo').disabled=true;
      const ok=await be.claimAdmin(pw);
      if(ok)boot();else{$('#tErr').textContent='รหัสไม่ถูกต้อง (หรือยังไม่ได้ตั้งรหัสครูในฐานข้อมูล)';$('#tErr').classList.remove('hidden');$('#tGo').disabled=false;}
    };
    $('#tGo').onclick=go;$('#tPass').onkeydown=e=>{if(e.key==='Enter')go();};
    $('#tBack').onclick=e=>{e.preventDefault();location.hash='';};
    setTimeout(()=>{const p=$('#tPass');if(p)p.focus();},50);
  }

  async function boot(){
    Object.keys(sigs).forEach(k=>delete sigs[k]);
    $('#view').innerHTML=`<div class="card tnav"><div class="tabs" id="ttabs"></div></div><div id="tbody"></div>`;
    bankUn=be.on('bank',v=>{B=v||{};bankReady=true;sched();},()=>{});
    idxUn=be.on('roomIndex',v=>{idx=v||{};sched();},()=>{});
    const c=savedRoom();
    if(c){try{const m=await be.get('rooms/'+c+'/meta');if(m)openRoom(c);else saveRoom('');}catch(e){}}
    if(!clockH)clockH=setInterval(clock,1000);
    sched();
  }
  function leaveTeacher(){
    closeRoom();
    if(bankUn){bankUn();bankUn=null;}if(idxUn){idxUn();idxUn=null;}
    if(clockH){clearInterval(clockH);clockH=null;}
  }

  /* ============================================================
     ROOM SUBSCRIPTIONS
     ============================================================ */
  function openRoom(code){
    closeRoom();R=code;saveRoom(code);views={};boardsKey='';focusG=null;
    S={meta:null,players:{},presence:{},assign:{},ginfo:{},g:{},ans:{},keys:{},lock:null,passive:false};
    const sub1=(k,p)=>be.on(b()+p,v=>{S[k]=v||{};sched();},()=>{});
    un=[be.on(b()+'meta',v=>{S.meta=v;sched();},()=>{}),
        sub1('players','players'),sub1('presence','presence'),sub1('assign','assign'),
        sub1('ginfo','ginfo'),sub1('g','g'),sub1('ans','ans'),sub1('keys','keys'),
        be.on(b()+'lock',v=>{S.lock=v;},()=>{})];
    tickH=setInterval(tick,500);
    sub='ctl';
  }
  function closeRoom(){
    un.forEach(f=>f());un=[];if(tickH){clearInterval(tickH);tickH=null;}
    R=null;S=null;views={};boardsKey='';focusG=null;
  }

  /* ============================================================
     ENGINE
     ============================================================ */
  function tick(){
    if(!S||!S.meta)return;
    const m=S.meta;
    if(m.status!=='order'&&m.status!=='play')return;
    const t=now(),lk=S.lock||{};
    if((m.v|0)!==VER){if(t-verWarn>8000){verWarn=t;toast('ห้องนี้สร้างจากเวอร์ชันเก่า: ปิดห้องแล้วเปิดห้องใหม่ (รีเฟรช Ctrl+Shift+R ก่อน)');}return;}
    if(lk.id!==tabId&&t-(lk.ts||0)<5000){if(!S.passive){S.passive=true;sched();}return;}
    if(S.passive){S.passive=false;sched();}
    if(lk.id!==tabId||t-(lk.ts||0)>1500)be.set(b()+'lock',{id:tabId,ts:be.TS}).catch(()=>{});
    try{if(m.status==='order')orderTick();else playTick();}catch(e){console.error(e);}
  }

  /* ----- starting order ----- */
  function orderTick(){
    const upd={};let any=false;
    for(const gid of gids()){
      const g=S.g[gid]||{},info=g.info||{};
      if(info.orderDone)continue;
      const ms=groupMem(gid),rolls=g.rolls||{},ord=Object.assign({},g.order||{});
      for(const u of ms){
        if(!ord[u]&&(rolls[u]||!S.presence[u])){const r=Engine.rollTwo();ord[u]=r;upd[b()+'g/'+gid+'/order/'+u]=r;any=true;}
      }
      if(ms.length&&ms.every(u=>ord[u])){
        const res=Engine.resolveOrder(ms,ord);
        const tb={};Object.keys(res.tb).forEach(u=>{if(res.tb[u]&&res.tb[u].length)tb[u]=true;});
        upd[b()+'g/'+gid+'/info']={size:ms.length,order:res.order,tb,orderDone:true};any=true;
      }
    }
    if(any)be.update(upd).catch(()=>{});
  }

  /* ----- play: one player at a time -----
     round = {n (turn no.), u (player), i, phase: roll → move → answer → result, ...}  */
  const ROLL_SECS=20;
  const acted={};
  const once=(k,ms)=>{const t=Date.now();if(acted[k]&&t-acted[k]<(ms||4000))return false;acted[k]=t;return true;};
  function playTick(){
    const m=S.meta,t=now(),cap=(m.startedAt||0)+(m.capMin||30)*60000;
    for(const gid of gids()){
      const gi=S.ginfo[gid];if(!gi||gi.status!=='playing')continue;
      const g=S.g[gid]||{},r=g.round;if(!r)continue;
      const ph=r.phase;
      if(ph==='wait'||ph==='result'){
        if(t<(r.next||0))continue;
        if(r.win){finishGroup(gid,r.win);continue;}
        if(m.paused)continue;
        if(t>=cap){finishGroup(gid,null);continue;}
        startTurn(gid);
      }else if(ph==='roll'){
        const rq=(g.rq||{})[r.u];
        if(rq===r.n||t>=r.deadline||(!S.presence[r.u]&&t>=r.t0+2500))doRoll(gid);
      }else if(ph==='move'){
        if(t>=r.next)beginAnswer(gid);
      }else if(ph==='answer'){
        const a=(S.ans[gid]||{})[r.u],got=a&&a.n===r.n;
        if((got&&t>=r.t0+700)||t>=r.deadline+2000||(!S.presence[r.u]&&t>=r.t0+3000))resolveTurn(gid);
      }
    }
  }

  function startTurn(gid){
    const g=S.g[gid]||{},ms=members(gid),r=g.round||{n:0},t=now();
    if(!ms.length||!once(gid+'|st|'+r.n))return;
    const cur=r.u?ms.indexOf(r.u):-1;
    let pick=-1;
    for(let j=1;j<=ms.length;j++){const i=((cur+j)%ms.length+ms.length)%ms.length;if(S.presence[ms[i]]){pick=i;break;}}
    if(pick<0)return;                       // nobody online: wait
    be.update({[b()+'g/'+gid+'/round']:{n:(r.n|0)+1,phase:'roll',u:ms[pick],i:pick,t0:t,deadline:t+ROLL_SECS*1000}}).catch(()=>{});
  }

  function doRoll(gid){
    const g=S.g[gid]||{},r=g.round,m=S.meta,t=now();
    if(!r||r.phase!=='roll'||!once(gid+'|rl|'+r.n))return;
    const u=r.u,pos=g.pos||{},from=pos[u]|0,nd=m.dn===1?1:2;
    const dice=[];for(let i=0;i<nd;i++)dice.push(1+rnd(6));
    const tot=dice.reduce((x,y)=>x+y,0),land=Math.min(100,from+tot);
    const kk=S.keys[gid]||{},used=A_(kk.used).slice();
    const qid=Engine.pickQuestion(B,Engine.levelFor(land),used);
    if(!qid){if(t-lastBankWarn>6000){lastBankWarn=t;toast('ธนาคารข้อสอบว่าง: เพิ่มหรือนำเข้าข้อสอบก่อน');}return;}
    used.push(qid);
    const pq=Engine.presentQuestion(qid,B[qid]);
    const mv=Math.round((1700+(land-from)*340+700)/SPEED);
    be.update({
      [b()+'g/'+gid+'/round']:{n:r.n,phase:'move',u,i:r.i,t0:r.t0,dice,tot,from,land,q:pq.pub,next:t+mv},
      [b()+'keys/'+gid]:{n:r.n,qk:pq.key,qo:pq.order,used:used.slice(-150)}
    }).catch(()=>{});
  }

  function beginAnswer(gid){
    const g=S.g[gid]||{},r=g.round,t=now();
    if(!r||r.phase!=='move'||!once(gid+'|an|'+r.n))return;
    const secs=S.meta.secs||20;
    be.update({[b()+'g/'+gid+'/round/phase']:'answer',[b()+'g/'+gid+'/round/t0']:t,[b()+'g/'+gid+'/round/deadline']:t+secs*1000}).catch(()=>{});
  }

  function resolveTurn(gid){
    const g=S.g[gid]||{},r=g.round,ms=members(gid),keys=S.keys[gid]||{},t=now();
    if(!r||r.phase!=='answer'||!once(gid+'|rs|'+r.n))return;
    const u=r.u,a=(S.ans[gid]||{})[u],got=a&&a.n===r.n?a:null;
    const valid=keys.n===r.n;
    const ok=valid&&!!got&&got.k===keys.qk;
    const from=r.from|0,land=r.land|0;
    const res={ok:ok?1:0,k:got?got.k:-1,qk:valid?keys.qk:-1,from,land,l2:land,b:0,j:0,to:from,win:0,tot:r.tot|0,
               ex:(B[r.q.id]&&B[r.q.id].e)||'',ms:got?Math.max(0,got.t-r.t0):null};
    if(ok){
      let mv;
      if(land<100&&Engine.SPECIAL.includes(land)){mv=Engine.applyBonus(land,true,2);res.b=1;}
      else mv=Engine.applyMove(from,r.tot|0);
      res.l2=mv.land;res.to=mv.to;res.j=mv.jump?1:0;res.win=mv.to>=100?1:0;
    }
    const pos=Object.assign({},g.pos||{});pos[u]=res.to;
    const vals=ms.map(x=>pos[x]|0);
    const upd={};
    upd[b()+'g/'+gid+'/pos/'+u]=res.to;
    upd[b()+'g/'+gid+'/round/res']=res;
    upd[b()+'g/'+gid+'/round/phase']='result';
    upd[b()+'g/'+gid+'/round/next']=t+Math.round((7200+(res.j?1600:0)+(res.b?1000:0)+(res.win?1500:0))/SPEED);
    if(res.win)upd[b()+'g/'+gid+'/round/win']=u;
    upd[b()+'ginfo/'+gid+'/lead']=Math.max(0,...vals);
    upd[b()+'ginfo/'+gid+'/avg']=vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length*10)/10:0;
    upd[b()+'ginfo/'+gid+'/rounds']=Math.ceil(r.n/Math.max(1,ms.length));
    const q0=B[r.q.id]||{};
    upd[b()+'log/'+gid+'_'+r.n+'_'+u]={g:gid,c:(S.players[u]&&S.players[u].cls)||'',u,n:r.n,q:r.q.id,tp:q0.tp||r.q.tp||'',lv:q0.t||r.q.t||0,
      k:res.k,ci:got&&keys.qo&&res.k>=0?keys.qo[res.k]:-1,ok:res.ok,b:res.b,ms:res.ms,
      nm:(S.players[u]&&S.players[u].name)||'',no:(S.players[u]&&S.players[u].no)|0,ts:t};
    be.update(upd).catch(e=>console.error(e));
  }

  function finishGroup(gid,winner){
    const g=S.g[gid]||{},pos=g.pos||{},ms=members(gid),t=now();
    let lead=0,leader=null;
    ms.forEach(u=>{if((pos[u]|0)>lead){lead=pos[u]|0;leader=u;}});
    const vals=ms.map(u=>pos[u]|0);
    const gi={status:'finished',lead:winner?100:lead,finishedAt:t,rounds:g.round?Math.ceil((g.round.n|0)/Math.max(1,ms.length)):0,
      avg:vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length*10)/10:0};
    if(winner){gi.winner=winner;gi.winnerName=pname(winner);}
    else if(leader){gi.leader=leader;gi.leaderName=pname(leader);}
    const upd={};Object.keys(gi).forEach(k=>{upd[b()+'ginfo/'+gid+'/'+k]=gi[k];});
    const others=gids().filter(x=>x!==gid&&S.ginfo[x].status!=='finished');
    if(!others.length){upd[b()+'meta/status']='done';upd[b()+'meta/endedAt']=t;upd[b()+'rank']={at:t};}
    be.update(upd).catch(()=>{});
  }

     ============================================================ */
  async function createRoom(){
    const al='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let code='';
    for(let i=0;i<30;i++){
      const c=Array.from({length:4},()=>al[rnd(al.length)]).join('');
      if(idx[c])continue;
      if(!(await be.get('rooms/'+c+'/meta'))){code=c;break;}
    }
    if(!code){toast('สร้างรหัสไม่สำเร็จ ลองใหม่');return;}
    const t=now();
    await be.update({['rooms/'+code+'/meta']:{status:'lobby',v:VER,created:t,secs:cfg.secs,capMin:cfg.capMin,ng:cfg.ng,dn:cfg.dn},['roomIndex/'+code]:{created:t,n:0}});
    openRoom(code);sched();
  }
  async function archiveRoom(){
    const code=R,upd={};
    ['meta','players','presence','assign','ginfo','g','ans','keys','rank','lock'].forEach(k=>{upd['rooms/'+code+'/'+k]=null;});
    closeRoom();saveRoom('');
    await be.update(upd);
    sched();
  }
  async function randomize(){
    const ids=Object.keys(S.players);
    if(ids.length<2){toast('ต้องมีนักเรียนอย่างน้อย 2 คน');return;}
    const m=S.meta;
    const groups=Engine.makeGroupsN(ids,m.ng||5);
    const clear={};['g','ans','keys','ginfo','assign','rank','lock'].forEach(k=>{clear[b()+k]=null;});
    await be.update(clear);
    const upd={};
    groups.forEach((mem,i)=>{
      const gid='g'+(i+1);
      upd[b()+'ginfo/'+gid]={name:'กลุ่ม '+(i+1),no:i+1,size:mem.length,status:'ready',lead:0,rounds:0};
      mem.forEach(u=>{upd[b()+'assign/'+u]=gid;});
      const fix=Engine.dedupeAvatars(mem,S.players);
      Object.keys(fix).forEach(u=>{upd[b()+'players/'+u+'/av']=fix[u];});
      upd[b()+'g/'+gid+'/info']={size:mem.length};
    });
    upd[b()+'meta/status']='grouped';
    await be.update(upd);
  }
  function backToLobby(){
    const clear={};['g','ans','keys','ginfo','assign','rank','lock'].forEach(k=>{clear[b()+k]=null;});
    clear[b()+'meta/status']='lobby';
    be.update(clear);
  }
  function startOrder(){be.set(b()+'meta/status','order');}
  function rollMissing(){
    const upd={};
    gids().forEach(gid=>{const g=S.g[gid]||{},rolls=g.rolls||{},ord=g.order||{};
      groupMem(gid).forEach(u=>{if(!ord[u]&&!rolls[u])upd[b()+'g/'+gid+'/rolls/'+u]=true;});});
    if(Object.keys(upd).length)be.update(upd);
  }
  function startGame(){
    const t=now(),upd={};
    gids().forEach(gid=>{
      members(gid).forEach(u=>{upd[b()+'g/'+gid+'/pos/'+u]=0;});
      upd[b()+'g/'+gid+'/round']={n:0,phase:'wait',next:t+Math.round(5000/SPEED)};
      upd[b()+'ginfo/'+gid+'/status']='playing';
    });
    upd[b()+'meta/status']='play';upd[b()+'meta/startedAt']=t;upd[b()+'meta/paused']=null;
    upd['roomIndex/'+R+'/n']=Object.keys(S.players).length;
    upd['roomIndex/'+R+'/groups']=gids().length;
    be.update(upd);
  }
  function togglePause(){
    const m=S.meta,t=now();
    if(m.paused)be.update({[b()+'meta/paused']:null,[b()+'meta/startedAt']:(m.startedAt||t)+(t-(m.pausedAt||t)),[b()+'meta/pausedAt']:null});
    else be.update({[b()+'meta/paused']:true,[b()+'meta/pausedAt']:t});
  }
  function endAll(){gids().forEach(gid=>{if(S.ginfo[gid].status!=='finished')finishGroup(gid,null);});}
  function kick(u){be.update({[b()+'players/'+u]:null,[b()+'assign/'+u]:null,[b()+'presence/'+u]:null});}
  function dropOffline(){
    const upd={};Object.keys(S.players).forEach(u=>{if(!S.presence[u]){upd[b()+'players/'+u]=null;upd[b()+'assign/'+u]=null;}});

  function analyze(rows){
    const q={},tp={},cl={},lv={1:{n:0,ok:0},2:{n:0,ok:0}};let ms=0,msN=0,ok=0;
    rows.forEach(r=>{
      const x=q[r.q]||(q[r.q]={id:r.q,n:0,ok:0,ms:0,msN:0,w:{},none:0});
      x.n++;x.ok+=r.ok;ok+=r.ok;
      if(r.k<0)x.none++;else if(!r.ok&&r.ci>0)x.w[r.ci]=(x.w[r.ci]||0)+1;
      if(r.ms!=null&&r.k>=0){x.ms+=r.ms;x.msN++;ms+=r.ms;msN++;}
      const t=tp[r.tp||'-']||(tp[r.tp||'-']={n:0,ok:0});t.n++;t.ok+=r.ok;
      const c=cl[r.c||'-']||(cl[r.c||'-']={n:0,ok:0});c.n++;c.ok+=r.ok;
      if(lv[r.lv]){lv[r.lv].n++;lv[r.lv].ok+=r.ok;}
    });
    return {q,tp,cl,lv,n:rows.length,ok,avgMs:msN?ms/msN:0};
  }
