    X.sort(sf.qo==='n'?(x,y)=>y.n-x.n||x.p-y.p:(x,y)=>x.p-y.p||y.n-x.n);
    return `<div class="card panel"><h3 class="kanit">วิเคราะห์รายข้อ (${X.length} ข้อ)</h3><p class="note" style="margin-top:0">กด "วิเคราะห์" เพื่อดูว่าตัวเลือกแต่ละข้อถูกเลือกกี่คน ใครตอบผิด และข้อสังเกตจากระบบ</p>
      <div class="scroll"><table class="tbl"><thead><tr><th>ข้อ</th><th>ตอบ</th><th>ถูก</th><th style="min-width:90px"></th><th></th></tr></thead><tbody>${X.slice(0,200).map(x=>{const bq=B[x.id]||{};return `<tr><td style="min-width:240px">${bq.q?Engine.fmt(bq.q):'<i class="muted">(ข้อนี้ถูกลบแล้ว '+esc(x.id)+')</i>'}<div class="muted" style="font-size:13px">${esc(bq.tp||'')}</div></td><td>${x.n}</td><td><b style="color:${col(x.p)}">${x.p}%</b></td><td>${bar(x.p)}</td><td><button class="btn ghost small" data-qk="${esc(x.id)}">วิเคราะห์</button></td></tr>`;}).join('')}</tbody></table></div></div>`;
  }
  function qDetailHTML(id,a){
    const x=a.q[id],bq=B[id]||{},p=pct(x.ok,x.n),W=A_(bq.w);
    const optsRows=[{t:bq.a||'',c:x.ok,good:true}].concat(W.map((t,i)=>({t,c:x.w[i+1]||0,good:false})));
    const rowsQ=logRows.filter(r=>r.q===id);
    const bad=rowsQ.filter(r=>!r.ok).sort((m,n2)=>thCmp(m.c||'~',n2.c||'~')||thCmp(rLab(m),rLab(n2)));
    const good=rowsQ.filter(r=>r.ok).sort((m,n2)=>thCmp(rLab(m),rLab(n2)));
    const mx=Math.max(1,...optsRows.map(o=>o.c));
    const ok0=x.n-x.ok;
    return `<div class="card panel"><div class="row"><button class="btn ghost small" data-back="q">← กลับรายการข้อ</button></div>
      <div class="muted" style="margin-top:10px;font-size:13px">${esc(bq.tp||'')}${bq.t?' · ระดับ'+(bq.t==1?'ง่าย':'กลาง'):''} · รหัส ${esc(id)}</div>
      <div class="q-text" style="margin-top:4px">${bq.q?Engine.fmt(bq.q):'<i class="muted">(ข้อนี้ถูกลบแล้ว)</i>'}</div>${bq.im?FIG(bq.im):''}
      <div class="stat3" style="margin-top:12px"><div class="card sbox"><div class="muted">ตอบ</div><b class="kanit">${x.n}</b></div><div class="card sbox"><div class="muted">ถูก</div><b class="kanit" style="color:${col(p)}">${p}%</b></div><div class="card sbox"><div class="muted">เวลาเฉลี่ย</div><b class="kanit">${x.msN?(x.ms/x.msN/1000).toFixed(1):'—'} วิ</b></div></div></div>
      <div class="card panel"><h3 class="kanit">ตัวเลือกแต่ละข้อถูกเลือกกี่คน</h3>${optsRows.map(o=>`<div class="hbar"><div class="hl">${o.good?'✓ ':''}${o.t?Engine.fmt(o.t):''}<small>${o.good?'เฉลย':'ตัวลวง'}</small></div><div class="hb"><i style="width:${Math.round(o.c/mx*100)}%;background:${o.good?'var(--good)':'var(--bad)'}"></i></div><div class="hp">${o.c}</div></div>`).join('')}${x.none?`<div class="hbar"><div class="hl">ไม่ตอบทัน</div><div class="hb"><i style="width:${Math.round(x.none/mx*100)}%;background:#9aa9b8"></i></div><div class="hp">${x.none}</div></div>`:''}</div>
      <div class="card panel"><h3 class="kanit">ข้อสังเกตจากระบบ</h3><ul style="margin:0 0 8px">${qNotes(x,bq).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${bq.e?`<div class="exp"><b>คำอธิบายเฉลย:</b> ${Engine.fmt(bq.e)}</div>`:''}</div>
      <div class="card panel"><h3 class="kanit">ผู้ที่ตอบผิด (${bad.length} ครั้ง)</h3>${bad.length?`<div class="scroll"><table class="tbl"><thead><tr><th>ชื่อ</th><th>ตอบ</th><th></th></tr></thead><tbody>${bad.map(r=>`<tr><td>${esc(rLab(r))}</td><td>${chosenHtml(r,bq)}</td><td><button class="btn ghost small" data-sk="${esc(r.u)}">ดูรายคน</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">ยังไม่มีผู้ตอบผิด</p>'}</div>
      <div class="card panel"><details><summary class="kanit" style="cursor:pointer">ผู้ที่ตอบถูก (${good.length} ครั้ง)</summary><p style="margin:8px 0 0">${good.map(r=>esc(rLab(r))).join(' · ')||'—'}</p></details></div>`;
  }
  /* ---- exports ---- */
  function exportCSV(){
    if(!logRows||!logRows.length){toast('ยังไม่มีข้อมูล');return;}
    const a=analyze(logRows);
    const rows=[['รหัสข้อ','หัวข้อ','ระดับ','คำถาม','เฉลย','จำนวนคำตอบ','ตอบถูก','%ถูก','ไม่ตอบ','เวลาเฉลี่ย(วิ)']];
    Object.values(a.q).sort((x,y)=>pct(x.ok,x.n)-pct(y.ok,y.n)).forEach(x=>{const q=B[x.id]||{};rows.push([x.id,q.tp||'',q.t||'',q.q||'',q.a||'',x.n,x.ok,pct(x.ok,x.n),x.none,x.msN?(x.ms/x.msN/1000).toFixed(1):'']);});
    download('สถิติรายข้อ_'+statsCode+'.csv',toCSV(rows),'text/csv');
  }
  function exportRaw(){
    if(!logRows||!logRows.length){toast('ยังไม่มีข้อมูล');return;}
    const rows=[['ห้อง','เลขที่','ชื่อ','กลุ่ม','รอบ','รหัสข้อ','หัวข้อ','ระดับ','ข้อพิเศษ','ถูก(1/0)','ตัวเลือกที่เลือก(0=เฉลย)','ข้อความที่ตอบ','เฉลย','เวลา(ms)']];
    logRows.forEach(r=>{const bq=B[r.q]||{};rows.push([r.c||'',r.no||'',r.nm||'',r.g,r.n,r.q,r.tp,r.lv,r.b,r.ok?1:0,r.ci,r.ok?(bq.a||''):chosenRaw(r,bq),bq.a||'',r.ms]);});
    download('คำตอบดิบ_'+statsCode+'.csv',toCSV(rows),'text/csv');
  }
  function exportStu(){
    if(!logRows||!logRows.length){toast('ยังไม่มีข้อมูล');return;}
    const L=sortStu(Object.values(byStudent(logRows)),'cls');
    const tps=[...new Set(logRows.map(r=>r.tp||'-'))].sort(thCmp);
    const rows=[['ห้อง','เลขที่','ชื่อ','ตอบทั้งหมด','ตอบถูก','%ถูก','เวลาเฉลี่ย(วิ)'].concat(tps.map(t=>'%ถูก: '+t)).concat(['รหัสข้อที่ตอบผิด'])];
    L.forEach(s=>rows.push([s.c||'',s.no||'',sNm(s),s.n,s.ok,pct(s.ok,s.n),s.msN?(s.ms/s.msN/1000).toFixed(1):''].concat(tps.map(t=>s.tp[t]?pct(s.tp[t].ok,s.tp[t].n):'')).concat([s.rows.filter(r=>!r.ok).map(r=>r.q).join(' ')])));
    download('สถิติรายบุคคล_'+statsCode+'.csv',toCSV(rows),'text/csv');
  }
  function exportWrong(key){
    if(!logRows||!logRows.length){toast('ยังไม่มีข้อมูล');return;}
    const rows=[['ห้อง','เลขที่','ชื่อ','รหัสข้อ','หัวข้อ','คำถาม','ที่ตอบ','เฉลย','คำอธิบาย']];
    sortStu(Object.values(byStudent(logRows)),'cls').filter(s=>!key||s.key===key).forEach(s=>s.rows.filter(r=>!r.ok).forEach(r=>{const bq=B[r.q]||{};rows.push([s.c||'',s.no||'',sNm(s),r.q,r.tp||bq.tp||'',bq.q||'',chosenRaw(r,bq),bq.a||'',bq.e||'']);}));
    if(rows.length<2){toast('ไม่มีข้อที่ตอบผิด');return;}
    download('ข้อที่ตอบผิด_'+statsCode+'.csv',toCSV(rows),'text/csv');
  }

  return {
    async enter(backend){
      be=backend;
      if(await be.hasAdmin())boot();else loginForm();
    },
    leaveView(){leaveTeacher();}
  };
})();

/* ============================================================
   START-UP
   ============================================================ */
(async function(){
  Board.mount();
  const view=$('#view');
  view.innerHTML='<div class="card panel center muted">กำลังเชื่อมต่อ…</div>';
  let be=null;
  try{be=await Backend.create(typeof FIREBASE_CONFIG!=='undefined'?FIREBASE_CONFIG:null);}
  catch(e){
    view.innerHTML=`<div class="card panel"><h2>เชื่อมต่อฐานข้อมูลไม่ได้</h2><p>${esc(e&&e.message||e)}</p><p class="note">ตรวจอินเทอร์เน็ต และตรวจว่าได้เปิด Anonymous sign-in ใน Firebase แล้ว</p></div>`;
    return;
  }
  if(be.kind==='demo')$('#demoTag').classList.remove('hidden');
  let mode=null;
  async function route(){
    const want=location.hash==='#teacher'?'teacher':'student';
    if(want===mode)return;
    if(mode==='teacher')Teacher.leaveView();
    if(mode==='student')Student.leaveView();
    mode=want;
    $('#modal').classList.add('hidden');
    if(want==='teacher')await Teacher.enter(be);else await Student.enter(be);
  }
  window.addEventListener('hashchange',route);
  route();
})();

</script>
